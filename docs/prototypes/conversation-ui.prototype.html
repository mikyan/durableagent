/* The page content fragments use the same tokens and page header. */
/* Disposable content-only styling. All selectors stay inside the content namespace. */
.ccp-page { color: var(--text); font-size: 16px; line-height: 1.4; padding: 0 0 16px; min-width: 0; }
.ccp-page *, .ccp-page *::before, .ccp-page *::after { box-sizing: border-box; }
.ccp-page button, .ccp-page input { font: inherit; color: inherit; }
.ccp-page button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ccp-page button:focus-visible, .ccp-page input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.ccp-page button:active { filter: brightness(1.12); }
.ccp-page .surface { background: var(--surface); border: 1px solid var(--line); border-radius: 25px; overflow: hidden; }
.ccp-page h2, .ccp-page p { margin: 0; }
.ccp-page h2 { font-size: 14px; font-weight: 600; }
.ccp-icon { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 24px; height: 24px; color: var(--muted); }
.ccp-icon svg, .ccp-page button > svg { width: 20px; height: 20px; flex-shrink: 0; }
.ccp-tone-green, .ccp-tone-accent { width: 28px; height: 28px; border-radius: 50%; }
.ccp-tone-green { color: var(--green); background: rgba(148,173,144,.12); }
.ccp-tone-accent { color: var(--accent); background: rgba(223,149,120,.12); }
.ccp-tone-green svg, .ccp-tone-accent svg { width: 17px; height: 17px; }
.ccp-muted { color: var(--muted); font-size: 14px; }
.ccp-home { display: grid; gap: 13px; }
.ccp-card-heading { display: flex; align-items: center; gap: 9px; min-height: 47px; padding: 11px 15px 4px; color: var(--muted); }
.ccp-heading-button { border: 0; background: none; width: 100%; text-align: left; padding-bottom: 7px; }
.ccp-heading-button h2 { flex: 1; }
.ccp-heading-arrow { width: 16px; }
.ccp-heading-arrow svg { width: 16px; }
.ccp-current-main { display: flex; width: 100%; flex-direction: column; gap: 8px; padding: 8px 16px 15px; border: 0; background: none; text-align: left; }
.ccp-current-main > strong { font-size: 18px; line-height: 1.35; font-weight: 650; }
.ccp-current-status { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.ccp-activity-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 9px 16px; padding: 9px 16px 5px; font-size: 15px; }
.ccp-activity-summary strong { color: var(--green); font-weight: 600; }
.ccp-activity-summary > span { color: var(--accent); }
.ccp-clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ccp-current-footer { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 10px; margin-top: 2px; font-size: 13px; color: var(--muted); }
.ccp-phase { display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto; color: var(--muted); }
.ccp-phase-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ccp-phase-running, .ccp-phase-done { color: var(--green); }
.ccp-phase-waiting { color: var(--accent); }
.ccp-recent-list { padding: 0 14px 6px; }
.ccp-session-row { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 15px 16px; background: transparent; text-align: left; min-height: 77px; }
.ccp-session-row:last-child { border-bottom: 0; }
.ccp-session-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ccp-session-copy > strong { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 16px; font-weight: 600; }
.ccp-session-preview { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 14px; }
.ccp-session-time { color: var(--muted); font-size: 13px; white-space: nowrap; flex-shrink: 0; }
.ccp-compact { min-height: 64px; padding: 10px 0; gap: 8px; }
.ccp-compact .ccp-session-copy { gap: 1px; }
.ccp-compact .ccp-session-copy > strong { font-size: 15px; }
.ccp-compact .ccp-session-time { align-self: flex-end; margin-bottom: 1px; }
.ccp-separator { padding: 0 5px; }
.ccp-project-tag { margin-left: 8px; color: var(--green); font-size: 12px; }
.ccp-small-cards { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
.ccp-small-card { display: flex; min-height: 162px; padding: 14px; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; min-width: 0; }
.ccp-card-label { display: flex; align-items: center; gap: 7px; font-size: 14px; color: var(--muted); }
.ccp-card-number { font-size: 32px; line-height: 1.1; font-weight: 600; padding-top: 6px; }
.ccp-workspace-name { font-size: 23px; line-height: 1.3; padding-top: 8px; }
.ccp-small-detail { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; font-size: 14px; }
.ccp-small-card > .ccp-muted { font-size: 12px; }
.ccp-search { display: flex; align-items: center; gap: 12px; min-height: 53px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); padding: 0 15px; margin-bottom: 9px; }
.ccp-search input { border: 0; background: transparent; width: 100%; min-width: 0; height: 50px; outline-offset: 0; }
.ccp-search input::placeholder { color: var(--muted); opacity: 1; }
.ccp-tabs { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); padding: 4px; border-radius: 14px; min-height: 52px; }
.ccp-tabs button { flex: 1; background: transparent; border: 0; border-radius: 11px; min-height: 44px; color: var(--muted); font-size: 14px; font-weight: 600; }
.ccp-tabs .ccp-tab-active { color: var(--text); background: rgba(255,255,255,.055); }
.ccp-list-groups { margin-top: 25px; }
.ccp-section { margin-top: 23px; }
.ccp-section-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 5px 9px; color: var(--muted); }
.ccp-section-heading > span { font-size: 13px; }
.ccp-page .ccp-group { border-radius: 20px; }
.ccp-setting-row { display: flex; width: 100%; align-items: center; gap: 13px; min-height: 62px; background: transparent; border: 0; position: relative; padding: 15px 16px; text-align: left; }
.ccp-setting-row:not(:last-child)::after { content: ''; position: absolute; bottom: 0; left: 53px; right: 16px; height: 1px; background: var(--line); }
.ccp-row-copy { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
.ccp-row-copy > strong { font-weight: 600; }
.ccp-row-copy small { color: var(--muted); font-size: 13px; line-height: 1.45; }
.ccp-chevron { width: 16px; }
.ccp-chevron svg { width: 16px; }
.ccp-switch { display: inline-flex; width: 44px; height: 26px; padding: 3px; border-radius: 20px; flex: 0 0 auto; background: var(--floating); transition: background .15s; }
.ccp-switch > span { width: 20px; height: 20px; border-radius: 50%; background: var(--text); }
.ccp-switch-on { background: var(--green); }
.ccp-switch-on > span { transform: translateX(18px); background: var(--bg); }
.ccp-page .ccp-footnote { margin: 11px 5px 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.ccp-page .ccp-empty { padding: 25px 16px; color: var(--muted); font-size: 14px; text-align: center; }
.ccp-add-button { display: flex; justify-content: center; align-items: center; gap: 9px; width: 100%; margin-top: 14px; background: var(--surface); border: 1px solid var(--line); min-height: 52px; border-radius: 16px; }
.ccp-text-button { display: flex; align-items: center; justify-content: center; gap: 7px; background: transparent; border: 0; min-height: 44px; margin: 6px auto 0; }
.ccp-page .ccp-text-button, .ccp-page .ccp-selected { color: var(--green); }
.ccp-project-row { min-height: 98px; }
.ccp-path { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ccp-model-row { min-height: 79px; }
.ccp-radio { width: 20px; height: 20px; border: 1px solid var(--muted); border-radius: 50%; flex-shrink: 0; opacity: .6; }
.ccp-value { font-size: 14px; }
.ccp-filter-note { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; padding: 12px 4px 0; }
@container viewport (min-width: 1000px) {
  .ccp-home { grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); align-items: start; gap: 16px; }
  .ccp-current { grid-column: 1 / -1; grid-row: 1; }
  .ccp-recent { grid-column: 1; grid-row: 2; }
  .ccp-small-cards { grid-column: 2; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) { .ccp-switch { transition: none; } }

function richReply(){return '<p>已按类型整理这 <strong>42 个文件</strong>，重复文件保留在原处，没有删除。</p><div class="tool-disclosure"><button data-action="toggle-tool-log" aria-expanded="'+state.toolLogsOpen+'">'+I('terminal')+'<span>查看执行过程</span><span class="tool-end">3 次工具调用</span>'+I(state.toolLogsOpen?'chevronDown':'chevron')+'</button>'+(state.toolLogsOpen?'<div class="tool-log"><p><code>read</code> · 读取目录与文件元数据，找到 42 个文件。</p><p><code>bash</code> · 根据扩展名分类，保留疑似重复项。</p><p><code>write</code> · 保存索引和整理说明。以上均为示例记录。</p></div>':'')+'</div><h2>整理结果</h2><ul><li><strong>图片：18 个。</strong> 照片与截图放在同一分类下，文件名保持不变。</li><li><strong>文档：16 个。</strong> PDF、笔记和表格按原格式保留，没有改动正文。</li><li><strong>归档：8 个。</strong> 压缩包只做归类，没有自动解压。</li></ul><h2>重复文件先不处理</h2><p>有 3 个文件看起来是已有文件的副本。我把它们标进了索引，但仍保留在原位置。文件名相同不一定意味着内容相同，所以这次没有合并或覆盖。</p><p>后续如果要清理，可以先核对内容，再决定保留哪一份。当前这一步到此为止，不会自动删除这些文件。</p><h2>保留可追溯的记录</h2><p>索引中列出了每个文件的原始位置、归类位置和处理结果。即使之后继续整理，也可以根据这份记录核对已经完成的部分。</p><p>规则文件只记录分类方式；原始文档和照片没有被重写。整理说明里另列了重复项，方便你检查。</p><h2>这次修改的文件</h2>'+changedFiles.map(f=>'<button class="inline-file" data-action="open-file" data-id="'+f.id+'">'+I('file')+'<span class="file-name">'+esc(f.path)+'</span><span class="file-stat">+'+f.added+(f.removed?'<em>−'+f.removed+'</em>':'')+'</span>'+I('chevron')+'</button>').join('')+'<p style="margin-top:22px">点文件名可以展开查看具体变更。手机里会打开一个面板；横屏平板可以把它留在对话右侧，一边读回复，一边核对文件。</p><p><strong>现在不需要你做额外操作。</strong> 如果还想按年份细分图片，直接在这个会话里继续说就行。</p>';}
function attachmentMarkup(files){if(!files?.length)return '';return '<div class="message-files">'+files.map(f=>f.kind==='image'?'<img class="message-image" src="'+esc(f.url)+'" alt="'+esc(f.name)+'">':'<span class="message-file">'+I('file')+'<span class="ellipsis">'+esc(f.name)+'</span></span>').join('')+'</div>';}
function ChatBody(){const s=activeSession();if(!s.messages.length)return '<div class="chat-empty"><div class="empty-agent">π</div><h1>有什么想做的？</h1><p>直接开始，不用先建项目。<br><span class="quiet">'+esc(s.project||'默认工作区')+'</span></p><div class="empty-suggestions"><button data-action="suggestion" data-text="帮我整理下载目录，先不要删除文件">整理下载目录，保留原文件</button><button data-action="suggestion" data-text="看看这些笔记里有哪些重复的想法">从笔记里找出重复的想法</button></div></div>';return '<div class="thread"><div class="date-label">'+(s.group==='today'?'今天':'昨天')+' · '+esc(s.project||'默认工作区')+'</div>'+s.messages.map(m=>m.role==='user'?'<article class="user-message" data-message-id="'+m.id+'"><p>'+esc(m.text)+'</p>'+attachmentMarkup(m.attachments)+'</article>':'<article class="assistant-message" data-message-id="'+m.id+'"><div class="reply-marker"><span class="agent-mark">π</span> Agent</div>'+(m.rich?richReply():m.text.split('\n\n').map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join(''))+'<div class="message-time">'+esc(m.time||'刚刚')+'</div></article>').join('')+'</div>';}
function phaseMarkup(){const s=activeSession();if(s.phase==='waiting')return '<div class="phase-chip"><span class="dot waiting"></span> 等待 Wi-Fi · 进度已保存 <button data-action="allow-network">临时放行</button></div>';if(s.phase==='running')return '<div class="phase-chip"><span class="dot running"></span> 正在处理 · 可在此继续补充</div>';if(s.phase==='stopped')return '<div class="phase-chip"><span class="dot stopped"></span> 你已停止执行，不会自动续跑</div>';return '';}
function sendIcon(){const draft=state.drafts[state.activeId]||'';return draft.trim()||state.pending.length?'arrowUp':activeSession().phase==='running'?'stop':'wave';}
function Composer(){return '<footer class="composer-dock"><div class="dock-inner">'+phaseMarkup()+(state.pending.length?'<div class="pending-attachments">'+state.pending.map(f=>'<div class="pending-file">'+(f.kind==='image'?'<img src="'+esc(f.url)+'" alt="待发送图片">':I('file'))+'<div class="pending-name">'+esc(f.name)+'<small>'+esc(f.sizeLabel)+'</small></div>'+iconButton('close','移除 '+f.name,'remove-attachment','data-id="'+f.id+'"','')+'</div>').join('')+'</div>':'')+'<form id="composer" class="composer-capsule">'+iconButton('grid','会话详情与配置','show-sheet','data-sheet="conversation" aria-haspopup="dialog"','compose-icon details-trigger')+iconButton('plus','添加图片或文件','show-sheet','data-sheet="attachments"','compose-icon')+'<textarea id="messageInput" rows="1" placeholder="向 Agent 提问…" aria-label="消息输入">'+esc(state.drafts[state.activeId]||'')+'</textarea>'+iconButton('mic','语音入口（原型占位）','show-sheet','data-sheet="voice"','compose-icon microphone')+'<button id="sendButton" type="submit" class="send-button '+(sendIcon()==='stop'?'stop':'')+'" aria-label="'+(sendIcon()==='stop'?'停止当前执行':sendIcon()==='wave'?'语音入口（原型占位）':'发送模拟消息')+'">'+I(sendIcon())+'</button></form><div class="meta-capsule"><button class="context-button" data-action="show-sheet" data-sheet="context" aria-label="查看上下文占用 '+usagePercent()+'%"><svg class="context-gauge" viewBox="0 0 24 24" aria-hidden="true"><circle class="track" cx="12" cy="12" r="8"/><circle class="progress" cx="12" cy="12" r="8" pathLength="100" stroke-dasharray="'+usagePercent()+' 100"/></svg><span>'+usagePercent()+'%</span></button><button class="model-button" data-action="show-sheet" data-sheet="model-picker" aria-label="当前模型 '+esc(modelName())+'，选择模型"><span class="model-symbol">◈</span><span class="model-label">'+esc(modelName())+'</span>'+I('chevronDown')+'</button><button class="permission-button" data-action="show-sheet" data-sheet="permission" aria-label="权限模式 YOLO">'+I('shield')+'<span>YOLO</span></button></div></div></footer>';}
function ChatContent(){return '<div class="chat-scroll" id="chatScroll">'+ChatBody()+'</div><div class="prompt-anchor" id="promptAnchor" hidden><button class="anchor-text" id="anchorText" data-action="jump-prompt" aria-label="回到当前这条提问"></button>'+iconButton('close','隐藏这条提问的浮条','dismiss-prompt','','anchor-close')+'</div>'+iconButton('chevronDown','回到最新消息','jump-bottom','','jump-bottom')+Composer();}
function hasChanges(){return activeSession().id==='downloads';}
function FilePane(){const f=changedFiles.find(f=>f.id===state.selectedFile)||changedFiles[0];return '<div class="panel-inner"><header class="panel-header"><div class="panel-heading">本次变更</div>'+iconButton('close','收起文件变更','close-files','','panel-close')+'</header><div class="file-body">'+(hasChanges()?'<div class="file-subhead"><span>3 个文件</span><span class="file-stat">+62 <em>−2</em></span></div><div class="changed-file-list">'+changedFiles.map(file=>'<button class="changed-file '+(file.id===f.id?'selected':'')+'" data-action="select-file" data-id="'+file.id+'">'+I('file')+'<span class="file-label"><strong>'+esc(file.name)+'</strong><small>'+esc(file.path)+'</small></span><span class="file-stat">+'+file.added+(file.removed?'<em>−'+file.removed+'</em>':'')+'</span></button>').join('')+'</div><div class="diff-toolbar"><span>文件内容</span><span>变更视图</span></div><section class="diff-box"><div class="diff-title mono">'+esc(f.name)+'</div><div class="diff-lines">'+f.lines.map(([kind,text],index)=>'<div class="diff-line '+kind+'"><span class="line-number">'+(index+1)+'</span><span class="diff-sign">'+(kind==='add'?'+':kind==='remove'?'−':' ')+'</span><span>'+esc(text)+'</span></div>').join('')+'</div></section><p class="file-footer">'+I('info')+'<span>此处是示例变更，不是设备上的真实文件。</span></p>':'<div class="empty-changes">'+I('file')+'这个会话还没有文件变更。<br>变更出现后会放在这里。</div>')+'</div></div>';}
/* Disposable Hermes-style content bodies. Host owns state, shell, and delegated events. */
(function () {
  const attr = (value) => esc(String(value == null ? '' : value));
  const action = (name, extra = '') => `data-action="${name}" ${extra}`;
  const icon = (name, tone = '') => `<span class="ccp-icon ${tone}" aria-hidden="true">${I(name)}</span>`;
  const empty = (text) => `<p class="ccp-empty">${attr(text)}</p>`;
  const query = (page) => String(state.search[page] || '').trim().toLowerCase();
  const matches = (text, search) => String(text || '').toLowerCase().includes(search);
  const searchBox = (page, label) => `<label class="ccp-search">${icon('search')}<input type="search" data-search="${page}" aria-label="${label}" placeholder="${label}…" value="${attr(state.search[page])}" autocomplete="off"></label>`;
  const heading = (text, trailing = '') => `<div class="ccp-section-heading"><h2>${attr(text)}</h2>${trailing}</div>`;
  const group = (text, body, trailing = '') => `<section class="ccp-section">${heading(text, trailing)}<div class="surface ccp-group">${body}</div></section>`;
  const phase = (value) => `<span class="ccp-phase ccp-phase-${attr(value)}"><span class="ccp-phase-dot"></span>${attr(phaseText(value))}</span>`;
  const sessionRow = (session, compact = false) => `<button type="button" class="ccp-session-row ${compact ? 'ccp-compact' : ''}" ${action('open-conversation', `data-id="${attr(session.id)}"`)}><span class="ccp-session-copy"><strong>${attr(session.title)}</strong><span class="ccp-session-preview">${compact ? `${phase(session.phase)}<span class="ccp-separator">·</span>` : ''}${attr(session.preview || '开始对话')}${!compact && session.project ? `<span class="ccp-project-tag">${attr(session.project)}</span>` : ''}</span></span><span class="ccp-session-time">${attr(session.time)}</span></button>`;
  const row = (name, description, glyph, attributes = '', tail = '') => `<button type="button" class="ccp-setting-row" ${attributes}>${icon(glyph)}<span class="ccp-row-copy"><span>${attr(name)}</span>${description ? `<small>${attr(description)}</small>` : ''}</span>${tail || icon('chevron', 'ccp-chevron')}</button>`;
  const toggle = (on) => `<span class="ccp-switch ${on ? 'ccp-switch-on' : ''}" aria-hidden="true"><span></span></span>`;
  const networkText = () => state.network === 'wifi' ? 'Wi-Fi' : state.network === 'offline' ? '离线' : '移动网络';

  function HomeContent() {
    const running = sessions.filter(s => s.phase === 'running');
    const waiting = sessions.filter(s => s.phase === 'waiting');
    const activity = [...running, ...waiting];
    const recent = sessions.slice(0, 4);
    const currentBody = activity.length ? `<div class="ccp-activity-summary"><strong>${running.length} 个执行中</strong><span>${waiting.length} 个等待中</span></div><div class="ccp-recent-list">${activity.map(s => `<button type="button" class="ccp-activity-row" ${action('open-conversation', `data-id="${attr(s.id)}"`)}>${icon('chat')}<strong>${attr(s.title)}</strong>${phase(s.phase)}</button>`).join('')}</div>` : `<div class="ccp-current-main"><span class="ccp-current-status">${icon('check', 'ccp-tone-green')}<strong>暂无动态</strong></span><span class="ccp-muted">当前没有执行中或等待中的对话</span><button type="button" class="ccp-text-button" ${action('new-chat')}>${I('plus')} 开始对话</button></div>`;
    return `<div class="ccp-page ccp-home"><section class="surface ccp-current"><div class="ccp-card-heading">${icon('zap', 'ccp-tone-accent')}<h2>当前动态</h2></div>${currentBody}</section><section class="surface ccp-recent"><button type="button" class="ccp-card-heading ccp-heading-button" ${action('navigate', 'data-screen="sessions"')}>${icon('chat', 'ccp-tone-green')}<h2>最近对话</h2>${icon('chevron', 'ccp-heading-arrow')}</button><div class="ccp-recent-list">${recent.map(s => sessionRow(s, true)).join('') || empty('暂无对话')}</div></section><div class="ccp-small-cards"><button type="button" class="surface ccp-small-card" ${action('navigate', 'data-screen="projects"')}><span class="ccp-card-label">${icon('folder', 'ccp-tone-green')}项目</span><strong class="ccp-card-number">${projects.length}</strong><span class="ccp-small-detail">${attr(projects[0] ? projects[0].name : '创建第一个项目')}</span><span class="ccp-muted">集中管理项目工作</span></button><button type="button" class="surface ccp-small-card" ${action('set-filter', 'data-filter="default"')}><span class="ccp-card-label">${icon('layers', 'ccp-tone-accent')}工作区</span><strong class="ccp-workspace-name">默认</strong><span class="ccp-small-detail">${sessions.filter(s => !s.project).length} 个对话</span><span class="ccp-muted">未归入项目的对话</span></button></div></div>`;
  }

  function SessionsContent() {
    const filtered = sessions.filter(s => matches(`${s.title} ${s.preview} ${s.project || ''}`, query('sessions')) && (state.filter === 'default' ? !s.project : state.filter === 'projects' ? !!s.project : true) && (!state.projectFilter || s.project === state.projectFilter));
    const labels = { all: '全部', default: '默认', projects: '项目' };
    const tabs = ['all', 'default', 'projects'].map(key => `<button type="button" class="${state.filter === key ? 'ccp-tab-active' : ''}" aria-pressed="${state.filter === key}" ${action('set-filter', `data-filter="${key}"`)}>${labels[key]}</button>`).join('');
    return `<div class="ccp-page">${searchBox('sessions', '搜索对话')}<div class="ccp-tabs" aria-label="筛选对话">${tabs}</div>${state.projectFilter ? `<div class="ccp-filter-note">${icon('folder')}<span>${attr(state.projectFilter)}</span></div>` : ''}<div class="ccp-list-groups">${['today', 'yesterday'].map(day => { const rows = filtered.filter(s => s.group === day); return rows.length ? group(day === 'today' ? '今天' : '昨天', rows.map(s => sessionRow(s)).join(''), `<span>${rows.length}</span>`) : ''; }).join('')}${filtered.length ? '' : empty('没有符合条件的对话')}</div></div>`;
  }

  function ProjectsContent() {
    const visible = projects.filter(p => matches(`${p.name} ${p.path}`, query('projects')));
    return `<div class="ccp-page">${searchBox('projects', '搜索项目')}${group('我的项目', visible.map(p => `<button type="button" class="ccp-setting-row ccp-project-row" ${action('open-project', `data-id="${attr(p.id)}"`)}>${icon('folder', 'ccp-tone-green')}<span class="ccp-row-copy"><strong>${attr(p.name)}</strong><small class="ccp-path">${attr(p.path)}</small><small>${sessions.filter(s => s.project === p.name).length} 个对话</small></span>${icon('chevron', 'ccp-chevron')}</button>`).join('') || empty('没有找到匹配的项目'), `<span>${visible.length}</span>`)}<button type="button" class="ccp-add-button" ${action('new-project')}>${I('plus')} 新建项目</button><p class="ccp-footnote">通过项目集中管理对话和工作区文件。</p></div>`;
  }

  function ToolsContent() {
    const groups = [
      ['个性化', [
        ['外观', '', 'palette', action('show-sheet', 'data-sheet="theme"')],
        ['通知', state.notifications ? '已开启' : '已关闭', 'bell', action('toggle-notifications') + ` role="switch" aria-checked="${!!state.notifications}"`, toggle(state.notifications)]
      ]],
      ['运行环境', [
        ['运行环境', 'Android 本地执行环境', 'terminal', action('show-sheet', 'data-sheet="runtime"')],
        ['模型', '选择对话使用的模型', 'model', action('navigate', 'data-screen="models"')],
        ['网络', networkText(), 'wifi', action('show-sheet', 'data-sheet="network"')]
      ]],
      ['配置', [
        ['扩展', '工具与能力', 'layers', action('show-sheet', 'data-sheet="extensions"')],
        ['权限', 'YOLO 模式 · 免审批，不绕过网络策略', 'shield', action('show-sheet', 'data-sheet="permission"')],
        ['设置', '流量与偏好设置', 'settings', action('navigate', 'data-screen="settings"')]
      ]]
    ];
    let count = 0;
    const body = groups.map(([title, rows]) => { const visible = rows.filter(r => matches(`${r[0]} ${r[1]}`, query('tools'))); count += visible.length; return visible.length ? group(title, visible.map(r => row(...r)).join('')) : ''; }).join('');
    return `<div class="ccp-page">${searchBox('tools', '搜索工具')}<div class="ccp-list-groups">${body}${count ? '' : empty('没有找到匹配的工具')}</div></div>`;
  }

  function ModelsContent() {
    const current = activeSession();
    const visible = models.filter(m => matches(`${m.name} ${m.provider} ${m.note}`, query('models')));
    const providers = [...new Set(visible.map(m => m.provider))];
    return `<div class="ccp-page">${searchBox('models', '搜索模型')}<p class="ccp-footnote">为${current ? '当前对话' : '新对话'}选择模型。</p>${providers.map(provider => group(provider || '可用模型', visible.filter(m => m.provider === provider).map(m => `<button type="button" class="ccp-setting-row ccp-model-row" aria-pressed="${!!current && current.modelId === m.id}" ${action('select-model', `data-id="${attr(m.id)}"`)}>${icon('model')}<span class="ccp-row-copy"><strong>${attr(m.name)}</strong><small>${attr(m.note)}</small></span>${current && current.modelId === m.id ? icon('check', 'ccp-selected') : '<span class="ccp-radio" aria-hidden="true"></span>'}</button>`).join(''))).join('')}${visible.length ? '' : empty('没有找到匹配的模型')}<p class="ccp-footnote">此处为模型列表示例，不收集接口密钥。</p></div>`;
  }

  function SettingsContent() {
    return `<div class="ccp-page">${group('流量与连接', row('省流模式', state.dataSaver ? '已开启 · 在受限网络上限制受控的非模型联网' : '已关闭 · 不启用省流限制', 'leaf', action('toggle-saver') + ` role="switch" aria-checked="${!!state.dataSaver}"`, toggle(state.dataSaver)) + row('网络连接', networkText(), 'wifi', action('show-sheet', 'data-sheet="network"')))}<p class="ccp-footnote">模型通信与受控的本地操作仍可继续；受限的非模型联网等待网络条件恢复，或临时放行。</p>${group('偏好设置', row('外观', '深色', 'palette', action('show-sheet', 'data-sheet="theme"')) + row('通知', state.notifications ? '已开启' : '已关闭', 'bell', action('toggle-notifications') + ` role="switch" aria-checked="${!!state.notifications}"`, toggle(state.notifications)))}${group('执行与权限', row('YOLO 模式', '操作无需审批，仍须遵守网络策略', 'shield', action('show-sheet', 'data-sheet="permission"'), '<span class="ccp-value ccp-selected">已开启</span>') + row('运行环境', '本地环境', 'terminal', action('show-sheet', 'data-sheet="runtime"')))}<p class="ccp-footnote">临时界面原型，设置仅在本次访问中有效。</p></div>`;
  }

case 'select-model':activeSession().modelId=button.dataset.id;state.sheet=null;render();showToast('已切换当前会话的示例模型。');break;
case 'set-filter':state.filter=button.dataset.filter;state.projectFilter=null;state.sheet=null;if(state.screen==='home')navigate('sessions');else render();break;
case 'toggle-saver':state.dataSaver=!state.dataSaver;render();break;
case 'toggle-notifications':state.notifications=!state.notifications;render();showToast('只切换页面状态，不请求系统通知权限。');break;
case 'set-network':state.network=button.dataset.network;state.sheet=null;if(state.network==='wifi')sessions.filter(s=>s.phase==='waiting').forEach(s=>s.phase='running');render();break;
case 'allow-network':activeSession().phase='running';render();showToast('已模拟临时放行，不改变设备网络设置。');break;
case 'focus-search':document.querySelector('[data-search="'+state.screen+'"]')?.focus();break;
case 'new-project':showSheet('new-project');break;
case 'open-project':state.selectedProject=button.dataset.id;showSheet('project');break;
case 'project-new-chat':{const project=projects.find(p=>p.id===button.dataset.id);newChat(project.name);break;}
case 'project-conversations':{const project=projects.find(p=>p.id===button.dataset.id);state.filter='projects';state.projectFilter=project.name;navigate('sessions');break;}
case 'feedback':if(window.parent===window){showToast('请回到对话，描述这个页面哪里需要调整。');}else parent.postMessage({type:'pocket-follow-up',text:'我在 Console 参考原型里查看了「'+({home:'首页',chat:'聊天',sessions:'会话列表',projects:'项目',tools:'工具',models:'模型',settings:'设置'})[state.screen]+'」，使用'+(isWide()?'平板横屏':'手机')+'布局。我的修改意见是：',selection:{baseline:'Hermes Console',screen:state.screen,preview:state.preview,layout:isWide()?'tablet-landscape':'phone'}},'*');break;
}});
document.addEventListener('submit',event=>{if(event.target.id==='composer'){event.preventDefault();submitMessage();}else if(event.target.id==='projectForm'){event.preventDefault();const data=new FormData(event.target);const name=String(data.get('name')||'').trim();if(!name)return;projects.push({id:'project-'+sequence++,name,path:String(data.get('path')||'/Documents/'+name)});state.sheet=null;state.screen='projects';render();showToast('已创建内存中的示例项目。');}});
document.addEventListener('input',event=>{if(event.target.id==='messageInput'){state.drafts[state.activeId]=event.target.value;updateSendButton();}else if(event.target.id==='conversationSearch'){state.chatSearch=event.target.value;document.getElementById('conversationSearchResults').innerHTML=conversationSearchResults();}else if(event.target.dataset.search){const key=event.target.dataset.search;const caret=event.target.selectionStart;state.search[key]=event.target.value;const scroll=document.querySelector('.content-scroll');const y=scroll?.scrollTop||0;const content={sessions:SessionsContent,projects:ProjectsContent,tools:ToolsContent,models:ModelsContent}[key];if(content&&scroll){scroll.innerHTML=content();scroll.scrollTop=y;const input=scroll.querySelector('[data-search="'+key+'"]');input?.focus({preventScroll:true});input?.setSelectionRange(caret,caret);}}});
document.addEventListener('change',event=>{if(event.target.id==='phaseSelect'){activeSession().phase=event.target.value;render();}else if(['cameraPicker','imagePicker','filePicker'].includes(event.target.id)){const files=[...event.target.files];files.forEach(file=>{const image=file.type.startsWith('image/');state.pending.push({id:'attachment-'+sequence++,name:file.name,kind:image?'image':'file',url:image?URL.createObjectURL(file):null,size:file.size,sizeLabel:file.size>1048576?(file.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(file.size/1024))+' KB'});});event.target.value='';state.sheet=null;render();}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){state.sheet=null;state.drawer=false;state.fileDrawer=false;state.prototypeInfo=false;renderOverlays();renderPrototypeInfo();return;}if((state.sheet||state.drawer||state.fileDrawer)&&event.key==='Tab'){const controls=[...document.querySelectorAll('#overlayRoot button:not([disabled]),#overlayRoot input:not([disabled]),#overlayRoot textarea,#overlayRoot select')].filter(el=>el.offsetParent!==null);const first=controls[0],last=controls[controls.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}return;}if(event.target.id==='messageInput'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();submitMessage();}});
window.addEventListener('resize',()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(fitPreview);});
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='pocket-follow-up')return;if(!event.data.ok)showToast('无法打开反馈草稿，请直接回到对话告诉 Pi。');});
if(document.documentElement.dataset.build==='production'){document.getElementById('prototypeControls').hidden=true;document.getElementById('prototypeNotice').hidden=true;}
fitPreview();render();
</script>
</body>
</html>
