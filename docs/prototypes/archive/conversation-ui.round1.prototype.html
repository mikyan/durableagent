/* Throwaway variant B: cool paper, list-first mobile, persistent tablet split. */
body[data-variant='B'] {
  --bg: #eef2f6;
  --surface: #fbfcfe;
  --surface-soft: #f0f4f8;
  --text: #243347;
  --muted: #64748a;
  --line: #dce3ed;
  --accent: #315f9e;
  --accent-soft: #e6eef9;
  --on-accent: #ffffff;
  --danger: #b54b52;
  --warning: #956c2b;
  --shadow: 0 6px 24px #203c6010;
}
.variant-b, .variant-b * { box-sizing: border-box; }
.variant-b {
  height: 100%; min-height: 0; min-width: 0; overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1fr);
  background: var(--surface); color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
}
.variant-b button, .variant-b textarea { font: inherit; }
.variant-b button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.variant-b button:focus-visible, .variant-b textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.variant-b button { min-height: 44px; }
.variant-b .b-inbox, .variant-b .b-detail { height: 100%; min-height: 0; min-width: 0; overflow: hidden; }
.variant-b .b-inbox { display: flex; flex-direction: column; background: var(--surface-soft); }
.variant-b .b-detail { display: none; flex-direction: column; background: var(--surface); }
.variant-b[data-view='chat'] .b-inbox { display: none; }
.variant-b[data-view='chat'] .b-detail { display: flex; }
.variant-b .b-inbox-header { display: flex; align-items: center; gap: 6px; padding: 17px 16px 10px; flex-shrink: 0; }
.variant-b .b-heading { flex: 1; min-width: 0; }
.variant-b .b-eyebrow { display: block; font-size: 11px; color: var(--muted); letter-spacing: .04em; margin-bottom: 4px; }
.variant-b h1 { font-size: 23px; font-weight: 650; letter-spacing: -.04em; margin: 0; }
.variant-b .b-icon-button { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 12px; color: var(--muted); background: transparent; }
.variant-b .b-primary-icon { background: var(--accent); color: var(--on-accent); }
.variant-b .b-icon-button:hover { background: var(--accent-soft); color: var(--accent); }
.variant-b .b-filters { display: flex; margin: 8px 16px 0; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.variant-b .b-filters button { flex: 1; padding: 8px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; color: var(--muted); font-size: 14px; }
.variant-b .b-filters button[aria-pressed='true'] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 650; }
.variant-b .b-list-caption { min-height: 48px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; font-size: 12px; color: var(--muted); flex-shrink: 0; }
.variant-b .b-list-caption button { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); background: transparent; border: 0; padding: 0 2px 0 10px; font-size: 12px; }
.variant-b .b-session-scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 0 8px 12px; scrollbar-width: thin; }
.variant-b .session-row { width: 100%; min-height: 80px; display: flex; align-items: center; gap: 10px; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 14px 12px; color: var(--text); }
.variant-b .session-row.selected { background: var(--accent-soft); border-radius: 10px; border-bottom-color: transparent; box-shadow: inset 3px 0 var(--accent); }
.variant-b .session-row:hover { background: var(--accent-soft); }
.variant-b .session-copy { flex: 1; min-width: 0; }
.variant-b .session-title { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.variant-b .session-snippet { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.variant-b .session-meta { flex-shrink: 0; font-size: 11px; color: var(--muted); }
.variant-b .session-time { font-variant-numeric: tabular-nums; }
.variant-b .b-empty { text-align: center; padding: 36px 12px; font-size: 14px; line-height: 2; }
.variant-b .b-empty span { font-size: 12px; color: var(--muted); }
.variant-b .b-quick-compose { border-top: 1px solid var(--line); padding: 12px 16px 16px; background: var(--surface); flex-shrink: 0; }
.variant-b .b-compose-caption { display: flex; align-items: center; gap: 5px; margin-bottom: 9px; font-size: 12px; color: var(--text); }
.variant-b .b-compose-caption span { margin-left: auto; color: var(--muted); font-size: 11px; }
.variant-b .b-quick-compose form, .variant-b .b-detail-compose form { margin: 0; max-width: none; }
.variant-b textarea { min-width: 0; max-height: 120px; }
.variant-b .b-quick-compose textarea { min-height: 44px; }
.variant-b .b-detail-header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); min-height: 73px; flex-shrink: 0; }
.variant-b .b-detail-heading { min-width: 0; flex: 1; }
.variant-b h2 { margin: 0 0 5px; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.variant-b .b-detail-heading > span { font-size: 11px; color: var(--muted); }
.variant-b .b-thread { flex: 1; min-height: 0; min-width: 0; overflow: auto; overscroll-behavior: contain; padding: 20px 16px; scrollbar-width: thin; overflow-wrap: anywhere; }
.variant-b .b-detail-compose { padding: 8px 16px 16px; flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--line); }
.variant-b .b-status { margin-bottom: 8px; font-size: 12px; color: var(--muted); }
@media (min-width: 820px) {
  .variant-b { grid-template-columns: minmax(290px, 35%) minmax(0, 1fr); }
  .variant-b .b-inbox, .variant-b[data-view='chat'] .b-inbox { display: flex; border-right: 1px solid var(--line); }
  .variant-b .b-detail, .variant-b[data-view='inbox'] .b-detail { display: flex; }
  .variant-b .b-back { display: none; }
  .variant-b .b-detail-header { padding: 16px 24px; min-height: 85px; }
  .variant-b .b-thread { padding: 28px clamp(20px, 3vw, 56px); }
  .variant-b .b-detail-compose { padding: 12px 24px 20px; }
}
@media (max-height: 560px) {
  .variant-b .b-inbox-header { padding-top: 8px; padding-bottom: 2px; }
  .variant-b .b-eyebrow { display: none; }
  .variant-b .b-list-caption { min-height: 44px; }
  .variant-b .b-quick-compose { padding: 8px 12px; }
  .variant-b .b-compose-caption { margin-bottom: 5px; }
  .variant-b .b-detail-header { padding-top: 6px; padding-bottom: 6px; min-height: 58px; }
}

/* Throwaway C: quiet, bottom-first chat. The host owns viewport space and its switcher. */
body[data-variant='C'] {
  color-scheme: dark;
  --bg: #151c1b;
  --surface: #1b2422;
  --surface-soft: #232f2b;
  --text: #e4ede8;
  --muted: #9aafa5;
  --line: #34443d;
  --accent: #b2dbc6;
  --accent-soft: #2c4639;
  --on-accent: #16271e;
  --danger: #eaa89f;
  --warning: #d9c18d;
  --shadow: 0 14px 48px #0005;
}
.variant-c, .variant-c * { box-sizing: border-box; }
.variant-c {
  height: 100%; min-height: 0; min-width: 0;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
}
.variant-c button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.variant-c button:focus-visible, .variant-c textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: -2px;
}
.variant-c button svg { flex-shrink: 0; }
.variant-c .c-heading { flex: 0 0 auto; }

.variant-c .c-context { display: flex; align-items: center; gap: 6px; max-width: 28%; font-size: 11px; color: var(--muted); }
.variant-c .c-context span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.variant-c .c-chat-scroll { min-height: 0; min-width: 0; flex: 1; overflow: auto; overscroll-behavior: contain; scrollbar-color: var(--line) transparent; }
.variant-c .c-chat-content { max-width: 860px; min-height: 100%; margin: 0 auto; padding: 16px 20px 28px; overflow-wrap: anywhere; }
.variant-c .c-bottom { flex: 0 0 auto; min-width: 0; border-top: 1px solid var(--line); background: var(--surface); }
.variant-c .c-bottom-inner { max-width: 980px; margin: 0 auto; }
.variant-c .c-switch-row { display: flex; align-items: center; min-width: 0; padding: 4px 10px 0; gap: 4px; }
.variant-c .c-switch-track { min-width: 0; flex: 1; display: flex; align-items: center; gap: 6px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.variant-c .c-conversation { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; max-width: 220px; flex-shrink: 0; padding: 8px 11px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); }
.variant-c .c-conversation.is-active { border-bottom-color: var(--accent); color: var(--accent); }
.variant-c .c-chip-title { max-width: 135px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.variant-c .c-chip-phase { font-size: 10px; white-space: nowrap; opacity: .85; }
.variant-c .c-conversation .status-dot { flex: 0 0 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.variant-c .c-conversation .status-dot.running { background: var(--accent); }
.variant-c .c-conversation .status-dot.waiting { background: var(--warning); }
.variant-c .c-conversation .status-dot.offline, .variant-c .c-conversation .status-dot.stopped { background: var(--danger); }
.variant-c .c-history-shortcut { width: 44px; height: 44px; flex: 0 0 44px; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); }
.variant-c .c-no-conversations { padding: 12px; font-size: 12px; color: var(--muted); }
.variant-c .c-compose-area { padding: 5px 16px 9px; }

if(c.id==='downloads'||c.id==='travel'){html+='<details class="activity"><summary>'+Icon(finished?'check':c.phase==='running'?'refresh':'clock',15)+'<span class="activity-title">'+(finished?'已完成文件处理':c.id==='downloads'?'读取目录，核对文件':'已读取表格，等待处理依赖')+'</span><span style="font-size:10px">'+(finished?'完成':c.id==='downloads'?'26 / 42':'已保存')+'</span><span class="chevron">'+Icon('chevronRight',13)+'</span></summary><div class="activity-step">'+Icon('check',14)+'<span><strong>读取已授权目录</strong><code>'+esc(c.id==='downloads'?'手机 / Download':'手机 / Documents / 旅行资料')+'</code></span><span class="step-end">完成</span></div><div class="activity-step">'+Icon(finished?'check':'clock',14)+'<span><strong>'+esc(c.id==='downloads'?'核对类型与重复项':'准备表格处理依赖')+'</strong><code>仅为界面示例，没有读取真实文件</code></span><span class="step-end">'+esc(phaseLabel(c.phase))+'</span></div></details>';}
html+='</div>';if(['waiting','offline','stopped'].includes(c.phase)){html+='<div class="inline-note '+c.phase+'">'+Icon(c.phase==='stopped'?'stop':'clock',15)+'<span>'+(c.phase==='waiting'?'省流模式已暂停依赖下载。连接 Wi-Fi 后将继续，无需重新发送请求。':c.phase==='offline'?'当前需要连接模型。会话进度已保存，网络恢复后继续。':'你已停止本次执行，它不会在网络恢复后自动重启。')+'</span></div>';}
if(c.phase==='done'&&c.id!=='notes'){html+='<div class="message assistant"><div class="assistant-copy"><p>处理完成。文件仍在原目录，你可以继续在这个会话里提出修改要求。</p><p class="sample-note">以上为原型示例，没有实际修改文件。</p></div></div>';}
for(const message of c.messages){html+=message.role==='user'?'<div class="message user"><div class="user-bubble">'+esc(message.text)+'</div></div>':'<div class="message assistant"><div class="speaker"><span class="brand-mark">π</span>Agent<span class="speaker-meta">界面模拟</span></div><div class="assistant-copy"><p>'+esc(message.text)+'</p></div></div>';}
return html+'</div>';}

    <footer class="c-bottom">
      <div class="c-bottom-inner">
        ${!inbox ? `<div class="c-switch-row">
          <div class="c-switch-track" aria-label="切换对话">${chips || '<span class="c-no-conversations">新对话，从这里开始</span>'}</div>
          <button type="button" class="c-history-shortcut" data-action="open-history" aria-label="打开全部对话" title="全部对话">${Icon('more')}</button>
        </div>
        <div class="c-compose-area"><div class="c-status">${statusMarkup()}</div>
          <div class="c-composer">${composerMarkup({newChat: !active})}</div>
        </div>` : ''}
        <nav class="c-navigation" aria-label="主要导航">
          <button type="button" data-action="show-chat" class="c-nav-button${!inbox ? ' is-active' : ''}" ${!inbox ? 'aria-current="page"' : ''}>${Icon('chat')}<span>对话</span></button>
          <button type="button" data-action="show-inbox" class="c-nav-button${inbox ? ' is-active' : ''}">${Icon('clock')}<span>会话</span></button>
          <button type="button" data-action="new-chat" class="c-nav-button c-new-chat">${Icon('plus', 22)}<span>新对话</span></button>
          <button type="button" data-action="open-projects" class="c-nav-button">${Icon('folder')}<span>项目</span></button>
          <button type="button" data-action="open-settings" class="c-nav-button">${Icon('settings')}<span>设置</span></button>
        </nav>
      </div>

  </div>`;
}

const variants={A:{name:'专注对话',description:'聊天占据主画面。会话与项目放进抽屉；手机和平板都先保证阅读与输入。',render:VariantA},B:{name:'会话列表',description:'手机从最近会话进入，底部可以直接开聊。平板同时保留会话列表与当前对话。',render:()=>typeof VariantB==='function'?VariantB():VariantA()},C:{name:'底部优先',description:'把常用操作与快速切换放到下方，比较单手操作是否比顶部导航更顺手。',render:()=>typeof VariantC==='function'?VariantC():VariantA()}};
function snapshotState(){return {prototype:true,variant:state.variant,layout:variants[state.variant].name,mobileView:state.view,viewport:{width:innerWidth,height:innerHeight},activeConversation:{id:currentConversation().id,title:currentConversation().title,project:currentConversation().project,phase:currentConversation().phase},filter:state.filter,network:state.network,dataSaver:state.saver,authorization:'YOLO',modal:state.modal,drafts:{current:state.draft,newConversation:state.newDraft},recovered:state.recovered,conversations:conversations.map(c=>({id:c.id,title:c.title,project:c.project,phase:c.phase,messageCount:c.messages.length+(c.prompt?2:0)}))};}
function renderSwitcher(){const enabled=document.documentElement.dataset.build==='prototype';const bar=document.getElementById('prototypeSwitcher');bar.hidden=!enabled;if(!enabled){document.getElementById('prototypeNotice').hidden=true;document.documentElement.style.setProperty('--notice-height','0px');document.documentElement.style.setProperty('--prototype-space','0px');return;}bar.innerHTML='<button class="switch-arrow" data-action="previous-variant" aria-label="上一个布局方案">'+Icon('arrowLeft',18)+'</button><div class="variant-label"><strong>'+state.variant+' · '+variants[state.variant].name+'</strong><small>原型切换 · '+(['A','B','C'].indexOf(state.variant)+1)+' / 3</small></div><button class="switch-arrow" data-action="next-variant" aria-label="下一个布局方案"><span style="display:flex;transform:rotate(180deg)">'+Icon('arrowLeft',18)+'</span></button><button class="inspect-button" data-action="toggle-inspector" aria-label="查看原型说明与模拟状态" aria-expanded="'+state.inspector+'">'+Icon('more',18)+'</button>';}
function renderInspector(){const panel=document.getElementById('prototypePanel');panel.hidden=!state.inspector;if(!state.inspector)return;const c=currentConversation();panel.innerHTML='<h2>布局比较 · 原型控制<button data-action="toggle-inspector" aria-label="关闭原型控制">'+Icon('close',16)+'</button></h2><p>'+variants[state.variant].description+' 所有交互仅修改本页内存，不连接模型，不操作文件。</p><div class="prototype-options">'+['A','B','C'].map(v=>'<button class="'+(v===state.variant?'selected':'')+'" data-action="set-variant" data-variant="'+v+'">'+v+' · '+variants[v].name+'</button>').join('')+'</div><label>示例网络<select data-control="network" aria-label="模拟网络状态">'+[['cellular','移动网络'],['wifi','Wi-Fi'],['offline','离线']].map(([v,l])=>'<option value="'+v+'" '+(state.network===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label><label>当前会话状态<select data-control="phase" aria-label="模拟会话状态">'+['running','waiting','offline','done','stopped'].map(v=>'<option value="'+v+'" '+(c.phase===v?'selected':'')+'>'+phaseLabel(v)+'</option>').join('')+'</select></label><details><summary>完整界面状态（只读）</summary><pre>'+esc(JSON.stringify(snapshotState(),null,2))+'</pre></details><div class="prototype-feedback"><button data-action="feedback">向 Pi 反馈这个方向</button><button data-action="reset-demo">重置示例</button></div><p style="margin:10px 0 0;font-size:10px">独立页面支持 ?variant=A / B / C。左右方向键切换布局，输入框内不拦截。</p>';}
function renderModal(){const root=document.getElementById('modalRoot');root.hidden=!state.modal;if(!state.modal){root.innerHTML='';return;}let title='',body='',kind='sheet';if(state.modal==='history'){kind='drawer';title='会话';body='<button class="solid-button drawer-new" data-action="new-chat">'+Icon('plus',17)+'新建会话</button><div class="drawer-label">最近 · 默认与项目会话</div>'+sessionListMarkup()+'<div class="drawer-footer"><button data-action="open-projects">'+Icon('folder',17)+'项目</button><button data-action="open-settings">'+Icon('settings',17)+'设置</button></div>';}else if(state.modal==='projects'){title='选择工作上下文';body='<p class="modal-intro">无需项目也能直接开聊。选择下面的位置，会开启一个新的示例会话，不移动任何文件。</p><button class="project-row" data-action="choose-project" data-project=""><span class="project-folder">'+Icon('chat',18)+'</span><span class="project-copy"><strong>默认工作区</strong><small>不关联项目，直接开始</small></span>'+Icon('chevronRight',15)+'</button>'+projects.map(p=>'<button class="project-row" data-action="choose-project" data-project="'+esc(p.name)+'"><span class="project-folder">'+Icon('folder',18)+'</span><span class="project-copy"><strong>'+esc(p.name)+'</strong><small>'+esc(p.location)+'</small></span>'+Icon('chevronRight',15)+'</button>').join('')+'<form class="project-create" data-create-project><input aria-label="新的示例项目名称" placeholder="新项目名称" maxlength="30" required><button type="submit">创建示例</button></form><p class="settings-footnote">目录仅为示意。本原型不会申请系统权限或创建真实目录。</p>';}else{title='设置';body='<p class="modal-intro">示例设置，仅用于检查页面布局。</p><section class="settings-group"><h3>模型接入</h3><div class="setting-row"><span>接入方式</span><span class="setting-value">API Key</span></div><label class="setting-field"><span>Provider / 模型</span><select aria-label="示例模型"><option>默认模型（界面示例）</option></select></label><label class="setting-field"><span>API Key</span><input type="password" disabled placeholder="原型不收集或保存密钥"></label><small class="muted" style="font-size:10px">聊天与工具结果可能发送给你配置的模型服务。</small></section><section class="settings-group"><h3>移动端运行</h3><div class="setting-row"><span>省流模式<small>限制非模型联网；受控本地操作可继续。</small></span><button class="toggle '+(state.saver?'on':'')+'" role="switch" aria-checked="'+state.saver+'" aria-label="切换示例省流模式" data-action="toggle-saver"></button></div><div class="setting-row"><span>操作模式</span><span class="setting-value">YOLO · 首版不提供审批</span></div><div class="setting-row"><span>执行位置</span><span class="setting-value">Android 本机</span></div></section><p class="settings-footnote">执行后端尚未选定。这里不把 Termux、某个 UI 框架或其他候选方案写成产品设置。</p>';}
root.innerHTML='<div class="modal-scrim" data-action="close-modal"></div><section class="modal-panel '+kind+'" role="dialog" aria-modal="true" aria-label="'+title+'"><header class="modal-heading"><h2>'+title+'</h2><button class="icon-button" data-action="close-modal" aria-label="关闭'+title+'">'+Icon('close',19)+'</button></header><div class="modal-content">'+body+'</div></section>';}
function render(){document.body.dataset.variant=state.variant;document.getElementById('app').innerHTML=variants[state.variant].render();document.getElementById('noticeState').textContent=state.variant+' · '+phaseLabel(currentConversation().phase)+' · '+innerWidth+'px';renderSwitcher();renderModal();renderInspector();console.info('[UI prototype state]',snapshotState());}
function toast(message){const box=document.getElementById('toast');box.textContent=message;box.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.classList.remove('visible'),2800);}
function switchVariant(key){state.variant=key;state.view=key==='B'?'inbox':'chat';state.modal=null;try{const url=new URL(location.href);url.searchParams.set('variant',key);history.replaceState(null,'',url);}catch(error){console.info('This embedded viewer does not allow URL updates; the layout still changed.');}render();}
function cycleVariant(direction){const keys=['A','B','C'];switchVariant(keys[(keys.indexOf(state.variant)+direction+3)%3]);}
function createConversation(project=null){const id='new-'+(++newConversationIndex);conversations.unshift({id,title:project?'新会话 · '+project:'新会话',project,phase:'idle',time:'刚刚',prompt:'',reply:'',snippet:'还没有消息',requiresNetwork:false,messages:[]});state.activeId=id;state.view='chat';state.modal=null;state.filter='all';state.draft='';state.recovered=false;}
function submitMessage(text,makeNew){text=text.trim();if(!text)return;if(makeNew)createConversation();const c=currentConversation();if(!c.prompt){c.prompt=text;c.title=text.length>15?text.slice(0,15)+'…':text;c.reply='我会在这个会话中处理你的请求。当前是布局原型，这条回复没有调用模型，也没有访问文件。';}else{c.messages.push({role:'user',text},{role:'assistant',text:'已收到。这里仅模拟消息进入当前会话后的排版，不执行真实操作。'});}c.phase=state.network==='offline'?'offline':'running';c.time='刚刚';c.snippet='新消息 · 界面模拟';state.draft='';if(makeNew)state.newDraft='';state.view='chat';render();requestAnimationFrame(()=>document.querySelectorAll('.chat-scroll').forEach(el=>el.scrollTop=el.scrollHeight));}
function changeNetwork(value){state.network=value;state.recovered=false;for(const c of conversations){if(value==='offline'&&['running','waiting'].includes(c.phase))c.phase='offline';else if(value!=='offline'&&c.phase==='offline'){c.phase=value==='cellular'&&state.saver&&c.requiresNetwork?'waiting':'running';state.recovered=true;}else if(value==='wifi'&&c.phase==='waiting'){c.phase='running';state.recovered=true;}else if(value==='cellular'&&state.saver&&c.requiresNetwork&&c.phase==='running')c.phase='waiting';}render();toast('已模拟'+networkLabel()+'，没有改变设备的真实网络。');}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(action==='previous-variant')return cycleVariant(-1);if(action==='next-variant')return cycleVariant(1);if(action==='set-variant')return switchVariant(button.dataset.variant);if(action==='toggle-inspector'){state.inspector=!state.inspector;renderSwitcher();renderInspector();return;}if(action==='new-chat'){createConversation();render();return;}if(action==='open-conversation'){state.activeId=button.dataset.id;state.view='chat';state.modal=null;state.draft='';state.recovered=false;render();return;}if(action==='open-history'){state.modal='history';state.filter='all';renderModal();return;}if(action==='open-projects'){state.modal='projects';renderModal();return;}if(action==='open-settings'){state.modal='settings';renderModal();return;}if(action==='close-modal'){state.modal=null;renderModal();return;}if(action==='show-inbox'){state.view='inbox';render();return;}if(action==='show-chat'){state.view='chat';render();return;}if(action==='filter-sessions'){state.filter=button.dataset.filter;render();return;}if(action==='choose-project'){createConversation(button.dataset.project||null);render();toast('已打开新的示例会话，没有修改任何文件。');return;}if(action==='prompt'){submitMessage(button.dataset.text,false);return;}if(action==='stop'){currentConversation().phase='stopped';currentConversation().snippet='你已停止执行';render();toast('已模拟停止；网络恢复不会重新启动这个会话的执行。');return;}if(action==='toggle-saver'){state.saver=!state.saver;if(!state.saver&&state.network!=='offline')conversations.forEach(c=>{if(c.phase==='waiting')c.phase='running';});else if(state.saver&&state.network==='cellular')conversations.forEach(c=>{if(c.requiresNetwork&&c.phase==='running')c.phase='waiting';});render();return;}if(action==='feedback'){if(window.parent!==window){parent.postMessage({type:'pocket-follow-up',text:'页面原型中，我更倾向 '+state.variant+'「'+variants[state.variant].name+'」这个方向。我的具体反馈是：',selection:{variant:state.variant,view:state.view,conversation:currentConversation().title}},'*');toast('已请求打开反馈草稿；如果查看器不支持，请直接在会话中告诉 Pi。');}else{toast('请在 Pi 会话中反馈：'+state.variant+'「'+variants[state.variant].name+'」。');}return;}if(action==='reset-demo'){location.reload();}});
document.addEventListener('submit',event=>{if(event.target.matches('[data-compose]')){event.preventDefault();submitMessage(event.target.querySelector('textarea').value,event.target.dataset.newChat==='true');}if(event.target.matches('[data-create-project]')){event.preventDefault();const name=event.target.querySelector('input').value.trim();if(!name)return;if(!projects.some(p=>p.name===name))projects.push({name,location:'示例工作区 / '+name});createConversation(name);render();toast('已创建内存中的示例项目，刷新后清除。');}});
document.addEventListener('input',event=>{if(event.target.matches('[data-compose] textarea')){if(event.target.closest('form').dataset.newChat==='true')state.newDraft=event.target.value;else state.draft=event.target.value;event.target.style.height='auto';event.target.style.height=Math.min(event.target.scrollHeight,116)+'px';}});
document.addEventListener('change',event=>{if(event.target.dataset.control==='network')changeNetwork(event.target.value);if(event.target.dataset.control==='phase'){const phase=event.target.value;if(phase==='waiting'){state.network='cellular';state.saver=true;}if(phase==='offline')state.network='offline';if(phase==='running'&&state.network==='offline')state.network='wifi';currentConversation().phase=phase;render();}});
document.addEventListener('keydown',event=>{const editable=event.target.closest('input,textarea,select,[contenteditable]');if(event.key==='Escape'){if(state.inspector){state.inspector=false;renderSwitcher();renderInspector();}else if(state.modal){state.modal=null;renderModal();}return;}if(editable){if(event.target.matches('[data-compose] textarea')&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();event.target.closest('form').requestSubmit();}return;}if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycleVariant(event.key==='ArrowLeft'?-1:1);}});
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='pocket-follow-up')return;if(!event.data.ok)toast('反馈草稿未打开：'+(event.data.error||'请直接在会话里回复。'));});
window.addEventListener('popstate',()=>{const v=new URLSearchParams(location.search).get('variant')?.toUpperCase();if(variants[v]){state.variant=v;state.view=v==='B'?'inbox':'chat';render();}});
window.addEventListener('resize',()=>{document.getElementById('noticeState').textContent=state.variant+' · '+phaseLabel(currentConversation().phase)+' · '+innerWidth+'px';if(state.inspector)renderInspector();});
render();
</script>
</body>
</html>
